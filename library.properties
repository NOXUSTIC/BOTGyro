sentence=Adaptive, calibrated gyroscope readings for the BOTGyro IMU.
paragraph=Self-contained driver for the BOTGyro 6-axis IMU (communicates directly over I2C, no external sensor library needed). Provides raw accelerometer and gyroscope data, optional zero-rate bias calibration with disturbance validation, an optional per-axis adaptive Kalman filter, optional fused pitch/roll orientation, a non-blocking state machine, live diagnostics, and automatic sensor fault recovery.
